; M5Tab5-VideoLink -- bidirectional audio/video intercom for two M5Stack Tab5
; (ESP32-P4) devices. Built with PlatformIO + ESP-IDF (via the pioarduino fork
; of the espressif32 platform, which adds ESP32-P4 support and ESP-IDF v5.5.x).
;
; The board definition is vendored in ./boards/m5stack-tab5-p4.json so the repo
; is self-contained regardless of the installed platform version.

[platformio]
default_envs = m5stack-tab5
boards_dir = boards

[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-tab5-p4
framework = espidf

board_build.partitions = partitions.csv
board_build.f_cpu = 360000000L

; Work around esp_ipa shipping a placeholder esp_ipa_pipeline_get_config() in
; its prebuilt lib that shadows the generated (real) one (see the script).
extra_scripts = pre:extra_scripts/fix_esp_ipa.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DAPP_VERSION=\"0.1.0\"
